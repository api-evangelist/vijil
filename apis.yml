aid: vijil
name: Vijil
description: >-
  Vijil is an AI agent trust platform (Mayfield-backed, ~$23M raised) that helps
  enterprises make AI agents reliable, secure, and safe for production. Its
  Console API and CLI span four products across the agent lifecycle: Diamond
  (pre-deployment red-team evaluation that returns a Trust Score across
  reliability, security, and safety), Dome (runtime Guardrails, Guards, and
  Detectors that defend agent inputs/outputs), Darwin (reinforcement-learning
  evolution that continuously improves agents), and Depot (hardened models and a
  secure MCP proxy). The platform is programmable via a JWT-authenticated REST
  API, the `vijil` CLI, an official `vijil-mcp` MCP server, and Python SDKs.
