      required:
      - agent_api_key
      - agent_model_name
      title: AgentEvaluationConfig
      description: 'Configuration for Diamond evaluation (resolved from agent).


        URL requirements depend on access level:

        - Black Box: agent_url is ALWAYS required (it''s where the opaque agent lives)

        - Grey/White Box: agent_url is only required for non-standard hubs (custom LLM endpoints)


        For standard hubs (OpenAI, Anthropic, etc.) in grey/white box mode,

        the SDK uses default endpoints so no URL is needed.


        ``protocol`` is included in workflow params so the Diamond worker can normalize ``agent_url``

        (e.g. ``.../v1/`` for chat_completions) even when the stored workflow predates registry fixes.'
    MCPConfig:
      properties:
        proxy_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Proxy Url
        access_level:
          anyOf:
          - $ref: '#/components/schemas/MCPAccessLevel'
          - type: 'null'
        server_urls:
          anyOf:
          - items:
              type: string
              maxLength: 2083
              minLength: 1
              format: uri
            type: array
          - type: 'null'
          title: Server Urls
      type: object
      title: MCPConfig
      description: MCP (Model Context Protocol) proxy configuration.
