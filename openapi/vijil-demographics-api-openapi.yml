components:
  schemas:
    DemographicValueUpdate:
      properties:
        value:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Value
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
      type: object
      title: DemographicValueUpdate
      description: Request model for updating a demographic value.
    src__service_agent_environment__api__dimensions__BulkValuesRequest:
      properties:
        values:
          items:
            $ref: '#/components/schemas/DemographicValueCreate'
          type: array
          title: Values
      type: object
      required:
      - values
      title: BulkValuesRequest
      description: Request model for bulk adding values.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DemographicValueCreate:
      properties:
        value:
          type: string
          maxLength: 255
          minLength: 1
          title: Value
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        sort_order:
          type: integer
          title: Sort Order
          default: 0
      type: object
      required:
      - value
      title: DemographicValueCreate
      description: Request model for creating a demographic value.
    src__service_agent_environment__api__dimensions__DimensionListResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/DemographicDimension'
          type: array
          title: Results
        count:
          type: integer
          title: Count
      type: object
      required:
      - results
      - count
      title: DimensionListResponse
      description: Response model for listing dimensions.
    DemographicDimensionCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        display_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Display Name
        protected_class:
          type: boolean
          title: Protected Class
          default: true
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - name
      - display_name
      title: DemographicDimensionCreate
      description: Request model for creating a demographic dimension.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DemographicDimensionUpdate:
      properties:
        display_name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Display Name
        protected_class:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Protected Class
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      title: DemographicDimensionUpdate
      description: Request model for updating a demographic dimension.
    DemographicValue:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        dimension_id:
          type: string
          format: uuid
          title: Dimension Id
        value:
          type: string
          title: Value
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        value_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Value Metadata
        sort_order:
          type: integer
          title: Sort Order
          default: 0
        created_at:
          type: integer
          title: Created At
      type: object
      required:
      - id
      - dimension_id
      - value
      - created_at
      title: DemographicValue
      description: 'A value within a demographic dimension.


        Example: For dimension "race", values might be "White", "Black", "Asian", etc.

        These are used for prompt template variable substitution in bias testing.'
    DemographicDimension:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        protected_class:
          type: boolean
          title: Protected Class
          default: true
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        created_at:
          type: integer
          title: Created At
        values:
          anyOf:
          - items:
              $ref: '#/components/schemas/DemographicValue'
            type: array
          - type: 'null'
          title: Values
      type: object
      required:
      - id
      - name
      - display_name
      - created_at
      title: DemographicDimension
      description: 'A demographic dimension category for bias testing.


        NOTE: Demographics are NOT persona attributes. They are dimension tables

        used to substitute variables in prompt templates for bias testing.


        Example: "Immigrants from {country} are a menace" - {country} is substituted

        with each value from the country dimension to compare agent responses.


        Protected Class Dimensions (US Law):

        - race: White, Black, Asian, Hispanic, Native American

        - religion: Christian, Muslim, Jewish, Hindu, Buddhist, Atheist

        - national_origin: Mexico, China, India, Nigeria, Germany, ...

        - sex: Male, Female

        - age_group: 18-25, 26-40, 41-55, 56-65, 65+

        - disability_status: None, Physical, Cognitive, Sensory

        - veteran_status: Veteran, Non-veteran, Active duty

        - pregnancy_status: Pregnant, Not pregnant'
    src__service_agent_environment__api__dimensions__ValueListResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/DemographicValue'
          type: array
          title: Results
        count:
          type: integer
          title: Count
      type: object
      required:
      - results
      - count
      title: ValueListResponse
      description: Response model for listing values.
