        s3_key:
          anyOf:
          - type: string
          - type: 'null'
          title: S3 Key
        generated_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Generated At
        prompt_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Prompt Count
        created_at:
          type: integer
          title: Created At
        updated_at:
          type: integer
          title: Updated At
        created_by:
          type: string
          format: uuid
          title: Created By
        creation_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Creation Error
