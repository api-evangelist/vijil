      required:
      - id
      - team_id
      - name
      - agent_id
      - created_at
      - updated_at
      - created_by
      title: CustomHarness
      description: 'Domain model for a custom harness (test configuration).


        A custom harness is a test configuration that combines an agent,

        personas, and policies. The backend generates evaluation prompts

        based on this configuration.


        Stored as metadata.json in S3.'
    CreateEvaluationRequest:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
          description: UUID of the agent from Agent Registry
        team_id:
          type: string
          format: uuid
          title: Team Id
          description: UUID of the team that owns this evaluation (required)
        type:
          type: string
          title: Type
          description: Type of evaluation to run. Currently only 'behavioral' is supported.
          default: behavioral
        harness_names:
          items:
            type: string
          type: array
          minItems: 1
          title: Harness Names
          description: List of harnesses to run (e.g., ['safety', 'ethics', 'privacy', 'security', 'toxicity'])
        harness_type:
          $ref: '#/components/schemas/HarnessType'
          description: 'Type of all harnesses: ''standard'' or ''custom''. All harnesses in harness_names must be of this type.'
          default: standard
        sample_size:
          anyOf:
          - type: integer
            maximum: 1000
            minimum: 1
          - type: 'null'
          title: Sample Size
          description: 'Number of prompts to randomly sample per harness. If omitted, all prompts run (~1250 for security). Recommended: 10 for fast iteration, 50 for moderate, 100 for thorough.'
        evaluation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluation Id
          description: Optional UUID for the evaluation. If provided, this UUID will be used when creating the evaluation in Diamond. If not provided, Diamond will generate one.
      type: object
      required:
      - agent_id
      - team_id
      - harness_names
      title: CreateEvaluationRequest
      description: Request model for creating a new evaluation.
    WorkflowStatus:
      type: string
      enum:
      - created
      - starting
      - running
      - succeeded
      - failed
      - cancelled
      title: WorkflowStatus
      description: 'Core lifecycle states for workflows.


        These are universal statuses that apply to all workflow types.

        Workflow-specific phases can be tracked using the optional `phase` field.'
