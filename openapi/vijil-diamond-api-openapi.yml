          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        persona_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Persona Ids
        policy_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Policy Ids
        status:
          $ref: '#/components/schemas/CustomHarnessStatus'
          default: draft
        workflow_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Id
